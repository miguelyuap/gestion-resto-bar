services:
  - type: web
    name: gst-resto-bar
    env: static
    buildCommand: npm install && chmod +x node_modules/.bin/* && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
